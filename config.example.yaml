# MilitaryVideoGen Configuration
# Copy this file to config.yaml and fill in your settings
# ⚠️ Never commit config.yaml to Git!

project_name: MilitaryVideoGen

# ==================== LLM Configuration ====================
# Supports any OpenAI SDK compatible API
llm:
  api_key: ""
  base_url: ""
  model: ""

# Popular presets:
# Qwen Max:        base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  model: "qwen-max"
# OpenAI GPT-4o:   base_url: "https://api.openai.com/v1"                          model: "gpt-4o"
# DeepSeek:        base_url: "https://api.deepseek.com"                           model: "deepseek-chat"
# Ollama (Local):  base_url: "http://localhost:11434/v1"                          model: "llama3.2"

# ==================== Direct API Provider Configuration ====================
# Optional: use providers directly for image/video/VLM generation without ComfyUI workflows.
api_providers:
  common:
    print_model_input: false
    local_proxy: ""
  openai:
    api_key: ""
    base_url: "https://api.openai.com/v1"
    use_proxy: false
  dashscope:
    api_key: ""
    base_url: "https://dashscope.aliyuncs.com/api/v1"
    use_proxy: false
  ark:
    api_key: ""
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    use_proxy: false
  kling:
    base_url: "https://api-beijing.klingai.com"
    access_key: ""
    secret_key: ""
    use_proxy: false

# ==================== ComfyUI Configuration ====================
comfyui:
  # Global ComfyUI settings
  comfyui_url: http://127.0.0.1:8188  # ComfyUI server URL (required for selfhost workflows)
  comfyui_api_key: ""  # ComfyUI API key (optional, get from https://platform.comfy.org/profile/api-keys)
  # Note for Docker users: Use host.docker.internal:8188 (Mac/Windows) or host IP address (Linux)
  runninghub_api_key: ""  # RunningHub API key (required for runninghub workflows)
  runninghub_concurrent_limit: 1  # Concurrent execution limit for RunningHub (1-10, default 1 for regular members)

  # MiniMax H3 reference-to-video. Leave comfyui_url empty to reuse the global endpoint.
  h3_reference:
    enabled: true
    comfyui_url: ""
    workflow: selfhost/video_minimax_h3_reference.json
    max_reference_images: 4
    # Quantized profile recommended for practical latency on an L40.
    diffusion_model: minimax_h3_ref2va_pruned_int8_convrot.safetensors
    text_encoder: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    # H3 generation resolution; composition templates may use a different canvas size.
    width: 1344
    height: 768
  
  # TTS-specific configuration
  tts:
    default_workflow: selfhost/tts_edge.json  # TTS workflow to use
  
  # Image-specific configuration
  image:
    # Required: Default workflow to use (no fallback)
    # Options: selfhost/image_flux.json (default, requires local ComfyUI)
    #          runninghub/image_flux.json (cloud, requires RunningHub API Key)
    default_workflow: selfhost/image_flux.json
    
    # Image prompt prefix (optional)
    prompt_prefix: "Minimalist black-and-white matchstick figure style illustration, clean lines, simple sketch style"
  
  # Video-specific configuration
  video:
    # Required: Default workflow to use (no fallback)
    # Default: selfhost/video_ltx2_3_t2v.json (requires local ComfyUI and LTX 2.3 models)
    # Cloud option: runninghub/video_wan2.1_fusionx.json (requires RunningHub API Key)
    default_workflow: selfhost/video_ltx2_3_t2v.json
    
    # Video prompt prefix (optional)
    prompt_prefix: "Photorealistic military documentary footage, authentic real-world materials and scale, natural lighting, neutral color grading, physically plausible motion, restrained observational camera work"

# ==================== Template Configuration ====================
# Configure default template for video generation
template:
  # Default frame template to use when not explicitly specified
  # Determines video aspect ratio and layout style
  # Template naming convention:
  #   - static_*.html: Static style templates (no AI-generated media)
  #   - image_*.html: Templates requiring AI-generated images
  #   - video_*.html: Templates requiring AI-generated videos
  # Options: 
  #   - 1080x1920 (vertical/portrait): image_default.html, image_modern.html, image_elegant.html, static_simple.html, etc.
  #   - 1080x1080 (square): image_minimal_framed.html, etc.
  #   - 1920x1080 (horizontal/landscape): image_film.html, image_full.html, etc.
  # See templates/ directory for all available templates
  default_template: "1080x1920/image_default.html"

# ==================== Web reference enhancement ====================
# Disabled by default. References enrich prompts but never block storyboard generation.
research:
  enabled: false
  default_mode: verified
  search:
    provider: searxng
    base_url: "${SEARXNG_BASE_URL:-http://searxng:8080}"
    # Direct-reachable baseline. Add overseas engines only when a stable egress exists.
    engines: [baidu, 360search, sogou]
    max_queries: 5
    max_results_per_query: 5
    max_pages: 8
    max_pages_per_domain: 2
    max_rounds: 2
    timeout_seconds: 20
  crawl:
    provider: crawl4ai
    base_url: "${CRAWL4AI_BASE_URL:-http://crawl4ai:11235}"
    # Variable name only. The token itself is read at runtime and never serialized.
    auth_token_env: CRAWL4AI_API_TOKEN
    global_concurrency: 2
    per_domain_concurrency: 1
    connect_timeout_seconds: 10
    request_timeout_seconds: 75
    page_timeout_seconds: 30
    max_redirects: 5
    max_html_bytes: 5242880
    max_pdf_bytes: 20971520
    cache_ttl_hours: 24
    official_cache_ttl_hours: 168
    failed_cache_ttl_minutes: 15
    # Do not treat robots.txt as an access-control mechanism. Real HTTP/WAF
    # denials (403/429, login walls, CAPTCHAs) are still handled as failures.
    respect_robots_txt: false
    allow_proxy_fake_ip: false
  verification:
    minimum_verified_claim_confidence: 0.75
    minimum_low_confidence_claim_confidence: 0.65
    # Descriptive mechanisms/trade-offs may use a verbatim-quoted ordinary source.
    # Numeric specifications, dates, inventories and performance claims still use
    # the stricter low-confidence threshold above.
    minimum_discovery_claim_confidence: 0.55
    minimum_visual_fact_confidence: 0.65
    structured_model: null
    total_timeout_seconds: 120
    extraction_timeout_seconds: 45
    planning_timeout_seconds: 30
